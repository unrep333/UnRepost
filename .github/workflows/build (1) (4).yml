            var tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
            var hl=1;try{hl=window.history.length||1}catch(e){}
            var origin='https://www.tiktok.com';try{origin=window.location.origin||origin}catch(e){}
            var base={WebIdLastTime:c.webId||'',aid:'1988',app_language:lang,app_name:'tiktok_web',browser_language:nav.language||lang,browser_name:'Mozilla',
              browser_online:''+(nav.onLine!==false),browser_platform:'MacIntel',browser_version:(nav.appVersion||('5.0 ('+(nav.userAgent||'')+')')),channel:'tiktok_web',
              cookie_enabled:''+(nav.cookieEnabled!==false),data_collection_enabled:'true',device_id:c.wid||'',device_platform:'web_pc',focus_state:'true',from_page:'video',
              history_len:''+hl,is_fullscreen:'false',is_page_visible:'true',os:'mac',priority_region:region,region:region,referer:'',root_referer:origin,
              screen_height:'982',screen_width:'1512',tz_name:tz,user_is_login:'true',webcast_language:lang};
            if(c.odin)base.odinId=c.odin;
            try{var m=document.cookie.match(/(?:^|; )s_v_web_id=([^;]*)/);if(m)base.verifyFp=decodeURIComponent(m[1])}catch(e){}
            for(var k in base)qs.set(k,base[k]);
            new URLSearchParams(STATIC).forEach(function(v,k){qs.set(k,v)});
            qs.set('count',''+count);qs.set('cursor',''+cur);qs.set('secUid',sc);
            return qs.toString();
          }
          function parseList(t){
            var h=(t||'').trim().charAt(0);
            if(h!=='{'){S.lastList='не JSON: '+(t||'').slice(0,40).replace(/\s+/g,' ');return{err:S.lastList}}
            var j;try{j=JSON.parse(t)}catch(e){return{err:'битый JSON'}}
            var code=(j.statusCode!==undefined?j.statusCode:j.status_code);
            S.lastList='поля: '+Object.keys(j).slice(0,6).join(',')+(code!==undefined?', код '+code:'');
            if(code!==undefined&&code!==0)return{err:'code '+code};
            return{items:(j.itemList||[]).map(function(x){return String(x.id||x.aweme_id)}),cursor:String(j.cursor!==undefined?j.cursor:'0'),more:(j.hasMore===undefined?null:!!j.hasMore)};
          }
          async function listDirect(cur){
            var sc=secUid();if(!sc)return{err:'no user'};
            var ac=typeof AbortController!=='undefined'?new AbortController():null,tid=ac?TMO(function(){ac.abort()},15000):0;
            try{
              var r=await NET('https://www.tiktok.com'+ITEM+'?'+richQS(readCtx(),30,cur,sc),{method:'GET',credentials:'include',headers:{'Accept':'*/*'},signal:ac?ac.signal:undefined});
              if(r.status!==200){S.lastList='HTTP '+r.status;return{err:'HTTP '+r.status}}
              return parseList(await r.text());
            }catch(e){return{err:String(e)}}finally{if(tid)CLR(tid)}
          }
          function loadFrame(url){
            return new Promise(function(res){
              var f=document.createElement('iframe'),done=false,t=0;
              function fin(v){if(done)return;done=true;try{if(t)CLR(t)}catch(e){}try{if(f.remove)f.remove();else document.body.removeChild(f)}catch(e){}res(v)}
              f.style.cssText='position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0;opacity:0';
              f.onload=function(){try{var b=f.contentDocument&&f.contentDocument.body;fin(b?(b.innerText||b.textContent||''):'')}catch(e){fin('')}};
              t=TMO(function(){fin('')},12000);
              f.src=url;(document.body||document.documentElement).appendChild(f);
            });
          }
          async function listCapture(cur){
            if(!S.listUrl)return{err:'нет запроса страницы'};
            try{
              var u=new URL(S.listUrl);u.searchParams.set('cursor',cur);
              var t=await loadFrame(u.toString());
              return t?parseList(t):{err:'рамка не ответила'};
            }catch(e){return{err:String(e)}}
          }
          async function getPage(cur){
            var order=S.tr==='capture'?['capture','direct']:['direct','capture'],best=null,last={err:'нет данных'};
            for(var k=0;k<order.length;k++){
              var tr=order[k];if(tr==='capture'&&!S.listUrl)continue;
              var p=tr==='direct'?await listDirect(cur):await listCapture(cur);
              var good=function(q){return !q.err&&(q.items.length||(cur!=='0'&&q.more===false))};
              if(good(p)){S.tr=tr;return p}
              if(!p.err&&!p.items.length){          // пусто, хотя «есть ещё»: короткий повтор
                await sleep(1500);p=tr==='direct'?await listDirect(cur):await listCapture(cur);
                if(good(p)){S.tr=tr;return p}
                if(!p.err)best=p;
              }
              if(p.err)last=p;
            }
            return best||last;
          }
          async function gate(){while(S.paused&&S.run)await sleep(400)}

          // ---- Шаг 1. Сканирование: собираем все репосты, ничего не удаляя ----
          async function scanAll(){
            var ids=[],seen={},cur='0',prev=null,empties=0,bad=0,back=10000;
            while(S.run){
              await gate();
              var p=await getPage(cur);
              if(p.err){
                if(++bad>6){S.diag='список: '+p.err+(S.lastList?' · '+S.lastList:'');return{err:true,ids:ids}}
                send('scanning','Ограничение TikTok, жду '+Math.round(back/1000)+' с');await sleep(back);back=Math.min(back*2,120000);continue}
              bad=0;back=10000;
              p.items.forEach(function(id){if(!seen[id]){seen[id]=1;ids.push(id)}});
              S.found=ids.length;send('scanning','Найдено: '+ids.length);
              if(!p.items.length){if(++empties>=8)break}else empties=0;
              if(p.more===false||p.cursor===cur||p.cursor===prev)break;
              prev=cur;cur=p.cursor;await sleep(jit(180,260));
            }
            return{ids:ids};
          }
          // Запасной способ: вкладка «Репосты» на странице профиля, прокрутка до конца, чтение ответов страницы
          function openTab(){
            try{
              var tab=document.querySelector('[data-e2e="repost-tab"]');
              if(!tab){
                var c=document.querySelectorAll('[role="tab"], a, p, span, div'),i;
                for(i=0;i<c.length;i++){var tx=(c[i].textContent||'').trim();
                  if(tx.length<20&&/reposts?|репост/i.test(tx)&&c[i].getClientRects().length>0){tab=c[i];break}}
              }
              if(!tab)return false;
              tab.click();return true;
            }catch(e){return false}
          }
          function scrollDown(){
            try{var se=document.scrollingElement||document.documentElement;window.scrollTo(0,se.scrollHeight);se.scrollTop=se.scrollHeight}catch(e){}
            try{var l=document.querySelectorAll('a[href*="/video/"]');if(l.length)l[l.length-1].scrollIntoView({block:'end'})}catch(e){}
          }
          async function drainObs(){
            var q=S.obsQ.splice(0,S.obsQ.length);
            for(var i=0;i<q.length&&S.run;i++){try{var r=await NET(q[i],{credentials:'include'});onList(await r.json(),false)}catch(e){}}
          }
          async function scanPage(){
            var it=0,still=0,last=-1;                 // то, что страница уже отдала при «прогреве», не сбрасываем
            while(S.run){
              await gate();it++;
              if(!S.pageAt&&it>16)break;
              if(!S.pageAt&&(it===1||it%3===0))openTab();
              if(!S.hookAt&&it>4)await drainObs();
              if(S.pageAt)scrollDown();
              await sleep(1600);
              var k=S.pageIds.length;
              if(k===last)still++;else{still=0;last=k}
              S.found=k;send('scanpage',k?('Найдено: '+k):'Открываю вкладку «Репосты»…');
              if(S.pageAt&&S.pageMore===false&&still>=2)break;
              if(S.pageAt&&still>=30)break;
            }
            return S.pageIds.slice();
          }
          async function scanFallback(){
            send('scanning','Список не пришёл, пробую другим способом…');
            for(var i=0;i<10&&S.run&&!S.listUrl;i++){if(i%3===0)openTab();await sleep(1000)}   // ждём подписанный запрос страницы (~8–10 с)
            if(S.listUrl&&S.run){var r=await scanAll();if(r.ids.length)return r.ids}
            if(!S.run)return[];
            return await scanPage();
          }

          S.pause=function(){S.paused=true;send('paused')};
          S.resume=function(){S.paused=false;send('running')};
          S.stop=function(){S.stopped=true;S.run=false;S.paused=false;Object.keys(S.waiters).forEach(function(id){S._wake(id)})};

          // ---- Шаг 2. Удаление: прямой запрос, при отказе — по запросу страницы (для каждого репоста по очереди) ----
          function delUrls(id){
            var o=[],d=new URL(DELBASE+'?aid=1988&app_name=tiktok_web&device_platform=web_pc');
            d.searchParams.set('item_id',id);d.searchParams.set('action_type','1');o.push(d.toString());
            if(S.listUrl){var b=new URL(S.listUrl),u=new URL(DELBASE);
              b.searchParams.forEach(function(v,k){if(STRIP.indexOf(k)<0)u.searchParams.set(k,v)});
              u.searchParams.set('item_id',id);u.searchParams.set('action_type','1');o.push(u.toString())}
            else o.push(null);
            if(S.delUrl){var e=new URL(S.delUrl);e.searchParams.set('item_id',id);o.push(e.toString())}
            else o.push(null);
            return o}
          async function del(id){
            var urls=delUrls(id),order=[S.delMode].concat([0,1,2].filter(function(m){return m!==S.delMode}));
            for(var k=0;k<order.length;k++){
              var u=urls[order[k]];if(!u)continue;
              var r=await NET(u,{method:'POST',credentials:'include',headers:HDR});
              var t='';try{t=await r.text()}catch(e){}
              var j=null;try{j=JSON.parse(t)}catch(e){}
              var code=j?(j.status_code!==undefined?j.status_code:j.statusCode):undefined;
              var msg=((j&&(j.status_msg||j.statusMsg))||'').toString().toLowerCase();
              S.lastDel='HTTP '+r.status+' '+t.replace(/\s+/g,' ').slice(0,70);
              if(r.status===429)return'rate';
              if(r.status===401||r.status===403){S.codes['H'+r.status]=(S.codes['H'+r.status]||0)+1;return'auth'}
              if(t.indexOf(MARK)>-1||/already|not exist|deleted/.test(msg)){S.delMode=order[k];return'ok'}
              if(r.status===200&&code===0){S.delMode=order[k];return'okw'}
              var key=code!==undefined?String(code):('H'+r.status);S.codes[key]=(S.codes[key]||0)+1;
            }
            return'fail';
          }
          var safeDel=function(id){return del(id).catch(function(){return'fail'})};
          function failDiag(){return Object.keys(S.codes).map(function(k){return k+'×'+S.codes[k]}).join(' ')+(S.lastDel?' · '+S.lastDel:'')}
          var lastSend=0;
          function ping(){var t=Date.now();if(S.removed%5===0||t-lastSend>400){lastSend=t;send('running')}}

          S.start=async function(){
            if(S.run)return;
            S.run=true;S.paused=false;S.stopped=false;
            await ensureSession();
            if(!secUid()){S.run=false;send('idle','Не удалось определить аккаунт. Откройте профиль → «Репосты» и нажмите кнопку снова.');return}
            try{document.querySelectorAll('video').forEach(function(v){v.pause();v.muted=true})}catch(e){}
            try{openTab()}catch(e){}                      // «прогрев»: страница сама сделает подписанный запрос, мы его запомним
            var pass=0,calm=0,empty=0,back=20000,burst=0,cyc=0;
            while(S.run){
              pass++;
              send('scanning','Сканирую репосты…');
              var r=await scanAll(),ids=r.ids;
              if(r.err){S.run=false;S.fin=true;send('error','TikTok не отдаёт список репостов. '+S.diag);return}
              if(!ids.length&&pass===1)ids=await scanFallback();
              if(!S.run)break;
              var queue=[];
              ids.forEach(function(id){
                if(S.skipped[id])return;
                if(S.gone[id]){                            // удалённый репост снова в списке: может быть кэш, ждём
                  S.stale[id]=(S.stale[id]||0)+1;
                  if(S.stale[id]>=3){delete S.gone[id];S.stale[id]=0;S.removed--;if((S.att[id]||0)>=2)S.skipped[id]=1;else queue.push(id)}
                  return}
                queue.push(id)});
              if(!queue.length){
                if(!ids.length){if(++empty>=2)break}else if(++calm>=6)break;
                await sleep(ids.length?4000:3000);continue}
              empty=0;calm=0;S.total+=queue.length;send('running');
              for(var i=0;i<queue.length&&S.run;i++){
                await gate();
                var id=queue[i];S.att[id]=(S.att[id]||0)+1;
                var res=await safeDel(id),t=0;
                while(res==='fail'&&t<2&&S.run){await sleep(jit(800,1500));res=await safeDel(id);t++}
                if(res==='ok'||res==='okw'){S.removed++;S.gone[id]=1;burst=0;ping()}
                else if(res==='rate'){S.total-=queue.length-i;S.att[id]--;send('running','Лимит TikTok, жду…');await sleep(back);back=Math.min(back*2,300000);break}
                else if(res==='auth'){S.run=false;S.fin=true;S.diag=failDiag();send('error','TikTok отклонил запрос: сессия истекла или доступ закрыт. Войдите заново.');return}
                else{
                  S.fl[id]=(S.fl[id]||0)+1;if(S.fl[id]>=3)S.skipped[id]=1;
                  S.diag=failDiag();burst++;
                  if(burst>=12){
                    if(++cyc>=3){S.run=false;S.fin=true;send('error','TikTok отклоняет удаление. '+failDiag());return}
                    send('running','Много отказов подряд, жду 20 с…');await sleep(20000);burst=0}
                }
                await sleep(jit(120,200));
              }
              if(S.run)await sleep(1500);
            }
            var stopped=S.stopped;S.run=false;
            if(stopped){S.stopped=false;send('idle','Остановлено. Удалено: '+S.removed);return}
            if(Object.keys(S.skipped).length)S.diag=failDiag();
            else if(!S.total)S.diag=(S.lastList||'')+(S.pageCode!==undefined?' | страница: код '+S.pageCode+', ответов '+S.pageIds.length:'');
            S.fin=true;send('done');
          };

          // ---- Удаление одного репоста из открытого видео ----
          function toast(t){
            if(typeof document==='undefined'||!document.body)return;
            var e=document.getElementById('ur-toast');
            if(!e){e=document.createElement('div');e.id='ur-toast';
              e.style.cssText='position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:2147483647;background:#222;color:#fff;font:14px sans-serif;padding:10px 16px;border-radius:12px';
              document.body.appendChild(e)}
            e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none'},2800)}
          S.delOne=async function(id){
            toast('Удаляю репост…');
            var r=await safeDel(id);
            if(r==='ok'||r==='okw'){S.removed++;toast('Репост удалён ✓');if(S.run)send('running');else check()}
            else toast(r==='rate'?'Лимит TikTok, подождите минуту':'Не получилось: возможно, это не ваш репост');
          };
          function vid(){var m=location.pathname.match(/\/video\/(\d+)/);return m&&m[1]}
          function addFab(){
            if(document.getElementById('ur-fab')||!document.body)return;
            var fab=document.createElement('div');fab.id='ur-fab';fab.textContent='Удалить репост';
            fab.style.cssText='position:fixed;right:12px;bottom:96px;z-index:2147483647;background:#fe2c55;color:#fff;font:600 14px sans-serif;padding:10px 14px;border-radius:22px;box-shadow:0 2px 10px rgba(0,0,0,.5)';
            fab.addEventListener('click',function(){var v=vid();if(v)S.delOne(v)});document.body.appendChild(fab)}
          // пункт «Удалить репост» в меню (скорость, качество, …, пожаловаться)
          function injectMenu(){
            var rep=document.evaluate("//*[not(*)][normalize-space(.)='Пожаловаться' or normalize-space(.)='Report']",document,null,9,null).singleNodeValue;
            if(!rep)return;
            var menu=rep;while(menu.parentElement&&!/Скорость|Speed/.test(menu.textContent||''))menu=menu.parentElement;
            if(!/Скорость|Speed/.test(menu.textContent||''))return;
            var row=rep;while(row.parentElement&&row.parentElement!==menu&&row.offsetWidth<menu.offsetWidth*0.85)row=row.parentElement;
            if(!row.parentElement||row.parentElement.querySelector('[data-ur]'))return;
            var it=row.cloneNode(true);it.setAttribute('data-ur','1');
            var w=document.createTreeWalker(it,NodeFilter.SHOW_TEXT),nd;
            while((nd=w.nextNode()))if(/Пожаловаться|Report/.test(nd.nodeValue))nd.nodeValue='Удалить репост';
            it.style.color='#fe2c55';it.style.cursor='pointer';
            it.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var v=vid();if(v)S.delOne(v)},true);
            row.parentElement.insertBefore(it,row)}
          var obs=null,lastHref='';
          function onMut(muts){
            if(!vid())return;
            for(var i=0;i<muts.length;i++){var a=muts[i].addedNodes;
              for(var k=0;k<a.length;k++){var n=a[k];
                if(n.nodeType===1&&n.childElementCount<80&&/Пожаловаться|Report/.test(n.textContent||'')){clearTimeout(S._t);S._t=setTimeout(injectMenu,120);return}}}}
          function route(){
            if(location.href===lastHref)return;lastHref=location.href;
            var f=document.getElementById('ur-fab');
            if(vid()){addFab();if(!obs&&document.body){obs=new MutationObserver(onMut);obs.observe(document.body,{childList:true,subtree:true})}}
            else{if(f)f.remove();if(obs){obs.disconnect();obs=null}}}
          if(typeof document!=='undefined'&&document.body&&typeof MutationObserver!=='undefined'){route();setInterval(route,1000)}
          check();
          })();
          EOF_UR
          base64 -d app/debug.keystore.b64 > app/debug.keystore
          base64 -d app/fonts_b64/ur_regular.b64 > app/src/main/res/font/ur_regular.ttf
          base64 -d app/fonts_b64/ur_bold.b64 > app/src/main/res/font/ur_bold.ttf
      - name: Build APK
        run: gradle assembleRelease --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: UnRepost build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UnRepost-apk
          path: app/build/outputs/apk/release/app-release.apk
