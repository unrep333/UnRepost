name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create project files
        run: |
          mkdir -p app/src/main/kotlin/app/unrepost app/src/main/assets app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/font app/fonts_b64
          cat > settings.gradle.kts <<'EOF_UR'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "UnRepost"
          include(":app")
          EOF_UR
          cat > build.gradle.kts <<'EOF_UR'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_UR
          cat > app/build.gradle.kts <<'EOF_UR'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "app.unrepost"
              compileSdk = 34
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "unrepost"; keyAlias = "unrepost"; keyPassword = "unrepost"; storeType = "pkcs12"
                  }
              }
              defaultConfig { applicationId = "app.unrepost"; minSdk = 26; targetSdk = 34; versionCode = 10; versionName = "1.9" }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                      isMinifyEnabled = false
                  }
              }
              lint { checkReleaseBuilds = false; abortOnError = false }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_UR
          cat > app/debug.keystore.b64 <<'EOF_UR'
          
          EOF_UR
          cat > app/fonts_b64/ur_regular.b64 <<'EOF_UR'
          
          EOF_UR
          cat > app/fonts_b64/ur_bold.b64 <<'EOF_UR'
          
          EOF_UR
          cat > app/src/main/AndroidManifest.xml <<'EOF_UR'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <application android:label="UnRepost" android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".KeepAliveService" android:exported="false"
                      android:foregroundServiceType="dataSync"/>
              </application>
          </manifest>
          EOF_UR
          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'EOF_UR'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FF2E7E" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF_UR
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF_UR'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <group android:rotation="90" android:pivotX="54" android:pivotY="54">
                  <path android:strokeColor="#FFE3EE" android:strokeWidth="6" android:strokeLineCap="round" android:strokeLineJoin="round"
                      android:pathData="M36,52 V44 A6,6 0 0 1 42,38 H68 M62,31.5 L68.5,38 L62,44.5 M72,56 V64 A6,6 0 0 1 66,70 H40 M46,63.5 L39.5,70 L46,76.5"/>
                  <path android:strokeColor="#FF2E7E" android:strokeWidth="13" android:strokeLineCap="round" android:pathData="M31,31 L77,77"/>
                  <path android:strokeColor="#FFFFFF" android:strokeWidth="6" android:strokeLineCap="round" android:pathData="M31,31 L77,77"/>
              </group>
          </vector>
          EOF_UR
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_UR'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF_UR
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF_UR'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF_UR
          cat > app/src/main/kotlin/app/unrepost/KeepAliveService.kt <<'EOF_UR'
          package app.unrepost

          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.os.*

          /** Держит процесс живым в фоне: уведомление + wake lock. Сама работа идёт в WebView. */
          class KeepAliveService : Service() {
              private var wl: PowerManager.WakeLock? = null
              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  val n = note(this, "Удаляю репосты…")
                  if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  else startForeground(1, n)
                  if (wl == null) wl = getSystemService(PowerManager::class.java)
                      .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "unrepost:run").apply { acquire(8 * 3600_000L) }
                  return START_NOT_STICKY
              }

              override fun onDestroy() { wl?.release(); super.onDestroy() }

              companion object {
                  @Volatile private var chan = false

                  private fun channels(c: Context) {
                      if (chan) return
                      val nm = c.getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(NotificationChannel("ur", "UnRepost", NotificationManager.IMPORTANCE_LOW))
                      nm.createNotificationChannel(NotificationChannel("ur_done", "UnRepost: готово", NotificationManager.IMPORTANCE_DEFAULT))
                      chan = true
                  }

                  private fun pending(c: Context): PendingIntent =
                      PendingIntent.getActivity(c, 0, Intent(c, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)

                  fun note(c: Context, text: String): Notification {
                      channels(c)
                      return Notification.Builder(c, "ur").setContentTitle("UnRepost").setContentText(text)
                          .setSmallIcon(android.R.drawable.stat_notify_sync).setContentIntent(pending(c)).setOngoing(true).build()
                  }

                  fun summary(c: Context, text: String): Notification {
                      channels(c)
                      return Notification.Builder(c, "ur_done").setContentTitle("UnRepost").setContentText(text)
                          .setSmallIcon(android.R.drawable.stat_notify_sync).setContentIntent(pending(c)).setAutoCancel(true).build()
                  }
              }
          }
          EOF_UR
          cat > app/src/main/kotlin/app/unrepost/MainActivity.kt <<'EOF_UR'
          package app.unrepost

          import android.Manifest
          import android.animation.LayoutTransition
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.content.MutableContextWrapper
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.view.WindowManager
          import android.view.animation.DecelerateInterpolator
          import android.webkit.*
          import android.widget.*
          import org.json.JSONObject

          /** Один WebView на весь процесс: переживает закрытие экрана и работает в фоне. */
          object Hub {
              var web: WebView? = null
              var desktop = false
              var st = "init"; var n = 0; var sk = 0; var msg = ""; var user = ""; var url = ""; var pageErr = ""; var starting = false; var startErr = ""
              var total = 0; var found = 0; var diag = ""
              var job = ""; var prevDesktop = false; var pageScanUsed = false; var blocking = false
              var ui: (() -> Unit)? = null
              val handler = Handler(Looper.getMainLooper())
              lateinit var app: Context
              private var lastNote = 0L
              private val engineJs: String by lazy { app.assets.open("engine.js").bufferedReader().use { it.readText() } }

              fun ua(ctx: Context): String {
                  val d = WebSettings.getDefaultUserAgent(ctx)
                  return if (desktop)
                      d.replace(Regex("\\(Linux; Android[^)]*\\)"), "(X11; Linux x86_64)").replace(" Mobile", "").replace("Version/4.0 ", "")
                  else d.replace("; wv", "").replace("Version/4.0 ", "")
              }

              @SuppressLint("SetJavaScriptEnabled")
              fun create(ctx: Context): WebView {
                  app = ctx.applicationContext
                  val w = WebView(MutableContextWrapper(app))
                  w.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, false) // страницу не «усыпляют» в фоне
                  w.settings.apply {
                      javaScriptEnabled = true; domStorageEnabled = true
                      useWideViewPort = true; loadWithOverviewMode = true
                      setSupportZoom(true); builtInZoomControls = true; displayZoomControls = false
                      mediaPlaybackRequiresUserGesture = true
                      setSupportMultipleWindows(false)
                      allowFileAccess = false; allowContentAccess = false
                      javaScriptCanOpenWindowsAutomatically = true
                      userAgentString = ua(app)
                  }
                  CookieManager.getInstance().apply { setAcceptCookie(true); setAcceptThirdPartyCookies(w, true) }
                  w.addJavascriptInterface(Bridge(), "Android")
                  w.webChromeClient = WebChromeClient()
                  w.webViewClient = object : WebViewClient() {
                      // ссылки на приложение (tiktok://, intent:, market:) не открываем: иначе страница заменяется пустой ошибкой
                      override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest): Boolean {
                          if (!r.isForMainFrame) return false
                          val sch = r.url.scheme ?: return false
                          return sch != "http" && sch != "https" && sch != "about" && sch != "blob" && sch != "data" && sch != "javascript"
                      }
                      override fun onPageStarted(v: WebView, u: String, icon: Bitmap?) { url = u; pageErr = ""; ui?.invoke() }
                      override fun onPageFinished(v: WebView, u: String) {
                          url = u; ui?.invoke()
                          if (u.contains("tiktok.com")) {
                              v.evaluateJavascript(engineJs, null)
                              // профиль открыт в компьютерном виде: запускаем сканирование и удаление
                              if (job == "run" && (u.contains("tiktok.com/@") || user.isEmpty())) {
                                  job = ""
                                  handler.postDelayed({ startEngine() }, 2500)
                              }
                          }
                      }
                      override fun onReceivedError(v: WebView, r: WebResourceRequest, e: WebResourceError) {
                          if (r.isForMainFrame) { pageErr = e.description.toString(); ui?.invoke() }
                      }
                      override fun onReceivedHttpError(v: WebView, r: WebResourceRequest, e: WebResourceResponse) {
                          if (r.isForMainFrame && e.statusCode >= 400) { pageErr = "HTTP " + e.statusCode; ui?.invoke() }
                      }
                      // пока идёт удаление, картинки, видео и шрифты не нужны: не грузим их, страница работает быстрее
                      override fun shouldInterceptRequest(v: WebView, r: WebResourceRequest): WebResourceResponse? {
                          if (!blocking) return null
                          val p = r.url.path ?: return null
                          val heavy = p.endsWith(".jpg") || p.endsWith(".jpeg") || p.endsWith(".png") || p.endsWith(".webp") || p.endsWith(".gif") ||
                              p.endsWith(".mp4") || p.endsWith(".webm") || p.endsWith(".woff2") || p.endsWith(".woff") || p.endsWith(".svg")
                          return if (heavy) WebResourceResponse("text/plain", "utf-8", java.io.ByteArrayInputStream(ByteArray(0))) else null
                      }
                      // систему не хватило памяти и она закрыла страницу: сообщаем, а не падаем
                      override fun onRenderProcessGone(v: WebView, d: RenderProcessGoneDetail): Boolean {
                          web = null
                          handler.post { onState("error", n, sk, "Система закрыла страницу TikTok (мало памяти). Нажмите кнопку ещё раз.", "", total, found, diag) }
                          return true
                      }
                  }
                  w.loadUrl("https://www.tiktok.com/login")
                  web = w
                  return w
              }

              /** Перед запуском убеждаемся, что страница TikTok загружена; иначе перезагружаем её и честно говорим об этом. */
              fun pageOk(): Boolean {
                  if (url.contains("tiktok.com") && pageErr.isEmpty()) return true
                  startErr = "Страница TikTok не загружена. Открываю её заново: нажмите кнопку ещё раз через несколько секунд."
                  web?.loadUrl("https://www.tiktok.com/")
                  ui?.invoke()
                  return false
              }

              /** Запуск удаления. Если движка на странице нет (страница сменилась), ставим его заново; если ответа нет, сообщаем. */
              fun startEngine() {
                  val w = web ?: return
                  val before = st
                  w.evaluateJavascript("(function(){return window.__UR?'ok':'no'})()") { r ->
                      if (r != null && r.contains("ok")) w.evaluateJavascript("__UR.start()", null)
                      else { w.evaluateJavascript(engineJs, null); w.evaluateJavascript("window.__UR&&__UR.start()", null) }
                  }
                  handler.postDelayed({
                      if (st == before && st == "ready") {
                          startErr = "Не удалось запустить: страница не отвечает. Я её обновляю, нажмите кнопку ещё раз."
                          app.stopService(Intent(app, KeepAliveService::class.java))
                          web?.reload()
                          ui?.invoke()
                      }
                  }, 6000)
              }

              fun isBusy(x: String): Boolean = x == "running" || x == "paused" || x == "scanning" || x == "scanpage"

              /** Запуск: открываем профиль в компьютерном виде (запросы TikTok рассчитаны на него), затем движок сам сканирует и удаляет. */
              fun beginRun() {
                  val w = web ?: return
                  prevDesktop = desktop; pageScanUsed = true
                  desktop = true
                  w.settings.userAgentString = ua(app)
                  blocking = true
                  job = "run"
                  st = "scanning"; msg = "Открываю профиль…"; found = 0; total = 0; n = 0; sk = 0; diag = ""; startErr = ""
                  ui?.invoke()
                  w.loadUrl(if (user.isNotEmpty()) "https://www.tiktok.com/@" + user else "https://www.tiktok.com/")
                  handler.postDelayed({
                      if (st == "scanning" && msg == "Открываю профиль…")
                          onState("idle", n, sk, "Не удалось открыть профиль TikTok. Проверьте соединение и попробуйте снова.", "", total, found, diag)
                  }, 45000)
              }

              /** Быстрое сканирование ничего не нашло: открываем профиль в компьютерном виде, там есть вкладка «Репосты». */
              fun beginPageScan() {
                  val w = web ?: return
                  if (user.isEmpty()) {
                      onState("idle", n, sk, "Не удалось определить имя аккаунта. Откройте профиль → «Репосты» и нажмите кнопку снова.", "", total, found, diag)
                      return
                  }
                  prevDesktop = desktop; pageScanUsed = true
                  desktop = true
                  w.settings.userAgentString = ua(app)
                  job = "scan"
                  st = "scanpage"; msg = "Открываю профиль…"; found = 0
                  ui?.invoke()
                  w.loadUrl("https://www.tiktok.com/@" + user)
                  handler.postDelayed({
                      if (st == "scanpage" && msg == "Открываю профиль…")
                          onState("idle", n, sk, "Не удалось открыть профиль TikTok. Проверьте соединение и попробуйте снова.", "", total, found, diag)
                  }, 45000)
              }

              fun cancelScan() {
                  job = ""
                  web?.evaluateJavascript("window.__UR&&__UR.stop()", null)
                  if (st == "scanpage" || st == "scanning") onState("idle", n, sk, "Остановлено.", "", total, found, diag)
              }

              fun onState(s: String, count: Int, skipped: Int, text: String, who: String, tot: Int, fnd: Int, dg: String) {
                  if (s == "needpage") { beginPageScan(); return }
                  // пока открывается профиль, служебные ответы страницы («готово / нужен вход») не должны сбивать экран
                  if ((st == "scanpage" || (st == "scanning" && msg == "Открываю профиль…")) && (s == "ready" || s == "idle") && text.isEmpty()) return
                  if (s == st && count == n && skipped == sk && text == msg && who == user && tot == total && fnd == found && dg == diag) return
                  val prevBusy = isBusy(st)
                  st = s; n = count; sk = skipped; msg = text; total = tot; found = fnd; diag = dg
                  starting = false
                  if (s != "ready") startErr = ""
                  if (who.isNotEmpty()) user = who
                  val nm = app.getSystemService(NotificationManager::class.java)
                  if (isBusy(s)) {
                      val now = SystemClock.elapsedRealtime()
                      if (now - lastNote > 2000) {
                          lastNote = now
                          val line = if (s == "running" || s == "paused") "Удалено: $count из $tot" else "Сканирую репосты: найдено $fnd"
                          nm.notify(1, KeepAliveService.note(app, line))
                      }
                  } else if (prevBusy) {
                      app.stopService(Intent(app, KeepAliveService::class.java))
                      blocking = false
                      if (pageScanUsed) { pageScanUsed = false; desktop = prevDesktop; web?.settings?.userAgentString = ua(app) }
                      if (s == "done" || s == "error")
                          nm.notify(2, KeepAliveService.summary(app, if (s == "done") "Готово. Удалено: $count, не удалось: $skipped" else text))
                  }
                  ui?.invoke()
              }
          }

          class Bridge {
              @JavascriptInterface
              fun post(j: String) {
                  Hub.handler.post {
                      try {
                          val o = JSONObject(j)
                          Hub.onState(o.getString("s"), o.optInt("removed"), o.optInt("skipped"), o.optString("msg"), o.optString("u"), o.optInt("t"), o.optInt("f"), o.optString("d"))
                      } catch (e: Exception) { }
                  }
              }

              /** Пауза движка считается здесь, а не в JS: JS-таймеры в фоне замедляются. */
              @JavascriptInterface
              fun sleep(ms: Long, id: Int) {
                  Hub.handler.postDelayed({ Hub.web?.evaluateJavascript("window.__UR&&__UR._wake($id)", null) }, ms)
              }
          }

          class MainActivity : Activity() {
              private val BG = 0xFF0E0E10.toInt()
              private val CARD = 0xFF1A1A1F.toInt()
              private val PINK = 0xFFFE2C55.toInt()
              private val SUB = 0xFF9A9AA6.toInt()
              private val LINE = 0xFF3A3A44.toInt()

              private lateinit var web: WebView
              private lateinit var homeBox: ScrollView
              private lateinit var webBox: LinearLayout
              private lateinit var runBox: LinearLayout
              private lateinit var avatar: TextView
              private lateinit var userTv: TextView
              private lateinit var stateTv: TextView
              private lateinit var infoTv: TextView
              private lateinit var primary: Button
              private lateinit var secondary: Button
              private lateinit var backBtn: TextView
              private lateinit var toolTitle: TextView
              private lateinit var webHint: TextView
              private lateinit var webInfo: TextView
              private lateinit var reloadBtn: TextView
              private lateinit var viewMode: TextView
              private lateinit var scanCancel: TextView
              private lateinit var spin: ProgressBar
              private lateinit var num2: TextView
              private lateinit var numLabel: TextView
              private lateinit var pbar: ProgressBar
              private lateinit var info2: TextView
              private lateinit var btn2: Button
              private var showWeb = false
              private var loginFlow = false
              private var busy = false
              private var cur = -1
              private var ver = ""
              private lateinit var dbg: TextView
              private lateinit var fReg: Typeface
              private lateinit var fBold: Typeface

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun shape(color: Int, radius: Int): GradientDrawable =
                  GradientDrawable().apply { setColor(color); cornerRadius = dp(radius).toFloat() }

              private fun ripple(base: Drawable): Drawable = RippleDrawable(ColorStateList.valueOf(0x33FFFFFF), base, null)

              private fun label(t: String, sp: Float, color: Int, bold: Boolean = false, center: Boolean = false): TextView =
                  TextView(this).apply {
                      text = t; textSize = sp; setTextColor(color)
                      typeface = if (bold) fBold else fReg
                      if (center) gravity = Gravity.CENTER
                  }

              private fun filled(): Button = Button(this).apply {
                  isAllCaps = false; setTextColor(Color.WHITE); textSize = 16f
                  typeface = fBold
                  background = ripple(shape(PINK, 28)); stateListAnimator = null
              }

              private fun outlined(): Button = Button(this).apply {
                  isAllCaps = false; setTextColor(Color.WHITE); textSize = 15f
                  typeface = fBold
                  background = ripple(GradientDrawable().apply { setColor(Color.TRANSPARENT); setStroke(dp(1), LINE); cornerRadius = dp(28).toFloat() })
                  stateListAnimator = null
              }

              private fun lp(w: Int, h: Int, top: Int = 0): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(w, h).apply { topMargin = dp(top) }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  fReg = resources.getFont(R.font.ur_regular)
                  fBold = resources.getFont(R.font.ur_bold)
                  ver = try { packageManager.getPackageInfo(packageName, 0).versionName ?: "" } catch (e: Exception) { "" }
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  window.statusBarColor = BG
                  window.navigationBarColor = BG

                  web = Hub.web ?: Hub.create(this)
                  (web.parent as? ViewGroup)?.removeView(web)
                  (web.context as? MutableContextWrapper)?.baseContext = this

                  // ---------- главный экран ----------
                  val logo = FrameLayout(this).apply {
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(PINK) }
                      outlineProvider = ViewOutlineProvider.BACKGROUND
                      clipToOutline = true
                      addView(ImageView(this@MainActivity).apply { setImageResource(R.drawable.ic_launcher_foreground) },
                          FrameLayout.LayoutParams(dp(150), dp(150), Gravity.CENTER))
                  }
                  avatar = label("T", 18f, Color.WHITE, bold = true, center = true).apply {
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(PINK) }
                  }
                  userTv = label("Аккаунт TikTok", 16f, Color.WHITE, bold = true)
                  stateTv = label("", 13f, SUB)
