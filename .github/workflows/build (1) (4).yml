              private fun box(s: Int): View = when (s) { 0 -> homeBox; 1 -> webBox; else -> runBox }
              private fun zOf(s: Int): Int = when (s) { 1 -> 0; 0 -> 1; else -> 2 }

              /** Итоговое состояние экранов после перехода. */
              private fun settle() {
                  homeBox.visibility = if (cur == 0) View.VISIBLE else View.GONE
                  runBox.visibility = if (cur == 2) View.VISIBLE else View.GONE
                  webBox.visibility = if (cur == 1) View.VISIBLE else if (cur == 2) View.GONE else View.INVISIBLE
                  for (v in arrayOf<View>(homeBox, runBox)) { v.alpha = 1f; v.translationY = 0f }
              }

              /** Плавный переход: верхний экран проявляется со сдвигом или растворяется. Сам WebView не анимируется. */
              private fun go(t: Int) {
                  if (t == cur) return
                  val from = cur
                  cur = t
                  if (from == -1) { settle(); return }
                  val nb = box(t)
                  val ob = box(from)
                  nb.animate().cancel(); ob.animate().cancel()
                  nb.visibility = View.VISIBLE
                  if (t == 1) web.onResume()
                  if (zOf(t) > zOf(from)) {
                      nb.alpha = 0f; nb.translationY = dp(14).toFloat()
                      nb.animate().alpha(1f).translationY(0f).setDuration(260).setInterpolator(DecelerateInterpolator()).withEndAction { settle() }.start()
                  } else {
                      nb.alpha = 1f; nb.translationY = 0f
                      ob.animate().alpha(0f).setDuration(220).withEndAction { settle() }.start()
                  }
              }

              /** Если система закрыла страницу TikTok, создаём её заново. */
              private fun ensureWeb() {
                  if (Hub.web != null) return
                  val old = web
                  (old.parent as? ViewGroup)?.removeView(old)
                  try { old.destroy() } catch (e: Exception) { }
                  web = Hub.create(this)
                  (web.context as? MutableContextWrapper)?.baseContext = this
                  webBox.addView(web, LinearLayout.LayoutParams(-1, 0, 1f))
              }

              private fun openWeb(login: Boolean) {
                  loginFlow = login; showWeb = true
                  if (Hub.pageErr.isNotEmpty() || Hub.url.isEmpty() || Hub.url.startsWith("about:")) web.loadUrl("https://www.tiktok.com/login")
                  web.onResume()
                  render()
              }

              /** Выход с экрана TikTok. После входа перепроверяем состояние: страница могла не сообщить о нём сама. */
              private fun leaveWeb() {
                  if (loginFlow && Hub.st != "ready") { Hub.st = "init"; web.loadUrl("https://www.tiktok.com/") }
                  showWeb = false; loginFlow = false; render()
              }

              private fun toggleView() {
                  Hub.desktop = !Hub.desktop
                  Hub.web?.let { w -> w.settings.userAgentString = Hub.ua(this); w.reload() }
                  render()
              }

              private fun startRun() {
                  // пока открыт системный запрос, экран может уйти в паузу: не даём WebView «заснуть» до старта
                  ensureWeb()
                  Hub.startErr = ""
                  Hub.starting = true
                  Hub.handler.postDelayed({ Hub.starting = false }, 10000)
                  try { startForegroundService(Intent(this, KeepAliveService::class.java)) } catch (e: Exception) { }
                  Hub.beginRun()
                  askBackgroundOnce()
              }

              /** Системный запрос «работать в фоне» показываем один раз за всё время. На некоторых телефонах проверка
               *  остаётся «нет» даже после разрешения, и запрос повторялся бесконечно. Работе он не мешает. */
              private fun askBackgroundOnce() {
                  val pm = getSystemService(PowerManager::class.java)
                  if (pm.isIgnoringBatteryOptimizations(packageName)) return
                  val p = getSharedPreferences("ur", MODE_PRIVATE)
                  if (p.getBoolean("bgAsked", false)) return
                  p.edit().putBoolean("bgAsked", true).apply()
                  try {
                      startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                  } catch (e: Exception) { }
              }

              private fun onPrimary() {
                  ensureWeb()
                  when (Hub.st) {
                      "ready" -> startRun()
                      "done" -> { Hub.st = "init"; Hub.web?.reload(); render() }
                      "error" -> { web.loadUrl("https://www.tiktok.com/login"); openWeb(true) }
                      else -> openWeb(true)
                  }
              }

              private fun onRunToggle() {
                  web.evaluateJavascript(if (Hub.st == "paused") "window.__UR&&__UR.resume()" else "window.__UR&&__UR.pause()", null)
              }

              private fun render() {
                  val s = Hub.st
                  busy = Hub.isBusy(s)
