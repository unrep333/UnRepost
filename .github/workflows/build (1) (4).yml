                  if (scanPage) window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  else window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  // главный экран
                  dbg.text = "v" + ver + " · " + (if (Hub.pageErr.isNotEmpty()) "ошибка: " + Hub.pageErr + " · " else "") + Hub.url.removePrefix("https://").take(36)
                  avatar.text = if (Hub.user.isEmpty()) "T" else Hub.user.substring(0, 1).uppercase()
                  userTv.text = if (Hub.user.isEmpty()) "Аккаунт TikTok" else "@" + Hub.user
                  secondary.text = "Открыть TikTok"
