                          primary.text = "Удалить все репосты"
                      }
                      "done" -> {
                          stateTv.text = if (Hub.total == 0 && Hub.n == 0) "Репосты не найдены" else "Готово ✓"
                          infoTv.text = "Удалено: ${Hub.n}. Не удалось удалить: ${Hub.sk}." +
                              (if (Hub.diag.isNotEmpty() && (Hub.total == 0 || Hub.sk > 0)) "\n" + Hub.diag else "")
                          primary.text = "Проверить ещё раз"
                      }
                      "error" -> {
                          stateTv.text = "Ошибка"
                          infoTv.text = Hub.msg.ifEmpty { "Что-то пошло не так." }
                          primary.text = "Войти заново"
                      }
                      "init" -> {
                          stateTv.text = "Проверяю вход…"
                          infoTv.text = "Это займёт несколько секунд."
                          primary.text = "Открыть TikTok"
                      }
                      else -> {
                          stateTv.text = "Нужен вход"
                          infoTv.text = Hub.msg.ifEmpty { "Войдите в TikTok. Если вы уже вошли, откройте профиль → «Репосты»." }
                          primary.text = "Войти в TikTok"
                      }
                  }

                  // экран TikTok (во время сканирования профиля вместо кнопок — «Отмена»)
                  backBtn.visibility = if (scanPage) View.GONE else View.VISIBLE
                  reloadBtn.visibility = if (scanPage) View.GONE else View.VISIBLE
                  viewMode.visibility = if (scanPage) View.GONE else View.VISIBLE
                  scanCancel.visibility = if (scanPage) View.VISIBLE else View.GONE
                  toolTitle.text = if (scanPage) "Сканирую репосты" else "TikTok"
                  val hint = if (scanPage) {
                      Hub.msg.ifEmpty { "Загружаю страницу…" } + " · не сворачивайте приложение"
                  } else when (s) {
                      "ready" -> "Откройте репост и нажмите «Удалить репост»"
                      "idle", "init" -> "Войдите. Если «Слишком много попыток» — подождите или войдите по SMS / QR (ПК-вид)"
                      else -> ""
                  }
                  webHint.text = hint
                  viewMode.text = if (Hub.desktop) "Телефонный вид" else "ПК-вид"
                  webInfo.text = (if (Hub.pageErr.isNotEmpty()) "Ошибка: " + Hub.pageErr + " · " else "") + Hub.url.removePrefix("https://").take(46)

                  // экран работы: сначала «найдено», потом «удалено из N»
                  val shown = if (scanPhase) Hub.found else Hub.n
                  val cnt = shown.toString()
                  if (busy && num2.text.toString() != cnt) {
                      num2.animate().cancel(); num2.scaleX = 1.1f; num2.scaleY = 1.1f
                      num2.animate().scaleX(1f).scaleY(1f).setDuration(200).start()
                  }
                  num2.text = cnt
                  numLabel.text = if (scanPhase) "репостов найдено" else "репостов удалено"
                  info2.text = when {
                      s == "paused" -> "На паузе"
                      scanPhase -> Hub.msg.ifEmpty { "Сканирую репосты…" }
                      else -> Hub.msg.ifEmpty { if (Hub.total > 0) "Осталось: " + (Hub.total - Hub.n - Hub.sk).coerceAtLeast(0) else "Удаляю репосты…" }
                  }
                  btn2.text = if (s == "paused") "Продолжить" else "Пауза"
                  spin.visibility = if (s == "paused") View.INVISIBLE else View.VISIBLE
                  pbar.visibility = if (!scanPhase && Hub.total > 0) View.VISIBLE else View.INVISIBLE
                  if (Hub.total > 0) pbar.setProgress(((Hub.n + Hub.sk).toLong() * 1000 / Hub.total).toInt().coerceIn(0, 1000), true)
              }

              override fun onStart() { super.onStart(); if (!busy) web.onResume() }
              override fun onStop() { if (!busy && !Hub.starting) web.onPause(); super.onStop() }

              @Deprecated("back")
              override fun onBackPressed() {
                  if (Hub.st == "scanpage") return   // идёт сканирование профиля: используйте «Отмена» на панели
                  if (!busy && showWeb) {
                      if (web.canGoBack()) web.goBack() else leaveWeb()
                  } else moveTaskToBack(true)
              }

              override fun onDestroy() {
                  Hub.ui = null
                  (web.parent as? ViewGroup)?.removeView(web)
                  (web.context as? MutableContextWrapper)?.baseContext = Hub.app
                  super.onDestroy()
              }
          }
