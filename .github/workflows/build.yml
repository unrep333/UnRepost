name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create project files
        run: |
          mkdir -p app/src/main/kotlin/app/unrepost app/src/main/assets
          cat > settings.gradle.kts <<'EOF_UR'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "UnRepost"
          include(":app")
          EOF_UR
          cat > build.gradle.kts <<'EOF_UR'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_UR
          cat > app/build.gradle.kts <<'EOF_UR'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "app.unrepost"
              compileSdk = 34
              defaultConfig { applicationId = "app.unrepost"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_UR
          cat > app/src/main/AndroidManifest.xml <<'EOF_UR'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application android:label="UnRepost" android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".KeepAliveService" android:exported="false"
                      android:foregroundServiceType="dataSync"/>
              </application>
          </manifest>
          EOF_UR
          cat > app/src/main/kotlin/app/unrepost/KeepAliveService.kt <<'EOF_UR'
          package app.unrepost

          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.os.*

          /** Держит процесс живым в фоне: уведомление + wake lock. Сама работа идёт в WebView. */
          class KeepAliveService : Service() {
              private var wl: PowerManager.WakeLock? = null
              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  val n = note(this, "Удаляю репосты…")
                  if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  else startForeground(1, n)
                  if (wl == null) wl = getSystemService(PowerManager::class.java)
                      .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "unrepost:run").apply { acquire(8 * 3600_000L) }
                  return START_NOT_STICKY
              }

              override fun onDestroy() { wl?.release(); super.onDestroy() }

              companion object {
                  fun note(c: Context, text: String): Notification {
                      c.getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(NotificationChannel("ur", "UnRepost", NotificationManager.IMPORTANCE_LOW))
                      val pi = PendingIntent.getActivity(c, 0, Intent(c, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                      return Notification.Builder(c, "ur").setContentTitle("UnRepost").setContentText(text)
                          .setSmallIcon(android.R.drawable.stat_notify_sync).setContentIntent(pi).setOngoing(true).build()
                  }
              }
          }
          EOF_UR
          cat > app/src/main/kotlin/app/unrepost/MainActivity.kt <<'EOF_UR'
